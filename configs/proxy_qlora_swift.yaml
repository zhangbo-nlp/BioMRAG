model: Qwen/Qwen2.5-VL-7B-Instruct
model_type: qwen2_5_vl
use_hf: false
torch_dtype: bfloat16
attn_impl: sdpa

dataset:
  - data/proxy/proxy_train.swift.jsonl
val_dataset:
  - data/proxy/proxy_val.swift.jsonl
split_dataset_ratio: 0
data_seed: 21
dataset_num_proc: 1
dataloader_num_workers: 4
load_from_cache_file: true

train_type: lora
target_modules: all-linear
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

quant_bits: 4
quant_method: bnb
bnb_4bit_quant_type: nf4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_use_double_quant: true

freeze_vit: true
freeze_aligner: true
freeze_llm: false
gradient_checkpointing: true

num_train_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
optim: adamw_torch
lr_scheduler_type: cosine
warmup_ratio: 0.0
weight_decay: 0.1
max_length: 4096

deepspeed: zero2
save_strategy: steps
eval_strategy: steps
save_steps: 500
eval_steps: 500
logging_steps: 10
report_to: none
save_total_limit: 2
save_only_model: true
output_dir: outputs/proxy/qwen2_5_vl_7b_qlora_seed21
seed: 21
