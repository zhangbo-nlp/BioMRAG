[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomrag"
version = "0.1.0"
description = "BioMRAG: subset-level utility deliberation for biomedical multimodal retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "tqdm>=4.64"
]

[project.optional-dependencies]
train = [
  "datasets>=2.18",
  "torch>=2.4,<2.5",
  "torchvision>=0.19,<0.20",
  "transformers>=4.49,<4.50",
  "accelerate>=0.29",
  "deepspeed>=0.14",
  "faiss-cpu>=1.8,<1.9"
]
eval = [
  "openai>=1.30",
  "pycocoevalcap==1.2"
]
qwen = [
  "transformers>=4.49,<4.50",
  "qwen-vl-utils>=0.0.8,<0.1",
  "bitsandbytes>=0.43",
  "peft>=0.11"
]
swift = [
  "ms-swift==3.12.6"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
